name: Issuer fact verification

# Checks published annual fees against official issuer pages from a GitHub
# runner (issuer domains are reachable here) and flags stale secondary sources.
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - quality/issuer-sources.json
      - scripts/verify-issuer-facts.mjs
      - scripts/lib/issuerFacts.mjs
      - data/cards.ts
      - data/cardProfileSpecs.ts

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify issuer pages and source freshness
        run: npm run verify:facts -- --issuers --write
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issuer-verification
          path: quality/issuer-verification.json
          if-no-files-found: ignore
