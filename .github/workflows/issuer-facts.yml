name: Issuer fact verification

# Checks published annual fees and the issuer terms our articles state against
# official issuer pages from a GitHub runner (issuer domains are reachable
# here) and flags stale secondary sources.
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - quality/issuer-sources.json
      - quality/issuer-claims.json
      - scripts/verify-issuer-claims.mjs
      - data/articles*.ts
      - scripts/verify-issuer-facts.mjs
      - scripts/lib/issuerFacts.mjs
      - data/cards.ts
      - data/cardProfileSpecs.ts

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: TEMP lounge probe (Issue 21, remove before PR)
        continue-on-error: true
        run: >
          node --max-http-header-size=131072 scripts/tmp/lounge-probe.mjs
          https://www.americanexpress.com/us/credit-cards/card/platinum/
          https://www.americanexpress.com/en-us/travel/lounges/the-platinum-card/
          https://www.thecenturionlounge.com/
          https://www.americanexpress.com/en-us/travel/the-centurion-lounge/access/
          https://www.capitalone.com/credit-cards/venture-x/
          https://www.capitalone.com/credit-cards/benefits/
          https://www.capitalone.com/lounges/airports/
          https://www.capitalone.com/credit-cards/venture-x/airport-lounges/
          https://www.capitalone.com/lp/lounges/
      - name: Verify issuer pages and source freshness
        run: npm run verify:facts -- --issuers --write
      - name: Verify article claims against issuer pages
        if: always()
        run: npm run verify:claims -- --issuers --write
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issuer-verification
          path: |
            quality/issuer-verification.json
            quality/issuer-claims-report.json
          if-no-files-found: ignore
